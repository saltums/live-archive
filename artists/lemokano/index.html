<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>檸檬をかじる彼女 archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --paper-2:#f6f5ef; --paper-3:#ebe9df; --ink:#141414; --ink-2:#6b6b66; --line:#e4e2d8;
  --lemon:#fff467; --lemon-deep:#f2d81c; --lemon-ink:#7a6a0b; --lemon-tint:#fffbd6;
  --band:#2f5f8a; --solo:#6a5a8c; --copy:#7b7f6a; --cancel:#a04b3c; --stream:#4f8a9a; --plan:#9a93a6;
  --display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --en:"Josefin Sans","Zen Kaku Gothic New",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--lemon-ink)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.25;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.sm{font-size:.8rem;color:var(--ink-2)}
.muted{color:var(--ink-2)}

/* icons */
.ic{width:18px;height:18px;flex:none;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ic.s{width:16px;height:16px;vertical-align:-3px}
.ic.l{width:22px;height:22px}
.ic.xl{width:34px;height:34px;stroke-width:1.5}

/* header (HP) */
header.site{padding:46px 0 0;background:var(--paper);position:relative;z-index:60}
.hdwrap{position:relative;text-align:center}
header.site h1{margin:0}
.txtlogo span{display:inline-block;font-family:var(--en);font-weight:700;font-size:clamp(2.1rem,7.4vw,4.4rem);letter-spacing:.02em;line-height:1;color:var(--ink);background:linear-gradient(transparent 70%,var(--lemon-tint) 70%);padding:0 .12em}
.unoff{display:inline-block;margin-top:10px;font-size:.74rem;color:var(--lemon-ink);background:var(--lemon-tint);border-radius:999px;padding:2px 12px}
header.site h1 img{display:block;margin:0 auto;width:min(760px,92%);height:auto}
header.site .sub{margin:18px 0 0;display:flex;justify-content:center;gap:10px;font-family:var(--en);font-size:.82rem;letter-spacing:.28em;color:var(--ink);text-transform:uppercase}
header.site .sub i{width:28px;height:1px;background:var(--ink);align-self:center}
.lemonbar{height:14px;background:linear-gradient(90deg,#fffbd6,var(--lemon) 35%,var(--lemon-deep) 75%,#2f5f8a);margin-top:34px}
@media (max-width:600px){header.site{padding-top:26px}header.site h1 img{width:min(250px,70%)}header.site .sub{letter-spacing:.18em;font-size:.72rem}.lemonbar{margin-top:22px}}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--ink)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px;justify-content:safe center}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:11px 8px 9px;color:#bdbdb6;border-bottom:3px solid transparent;white-space:nowrap;line-height:1.15}
nav.tabs a b{font-family:var(--en);font-weight:600;font-size:.76rem;letter-spacing:.08em}
nav.tabs a small{font-size:.62rem;margin-top:3px;opacity:.8}
nav.tabs a:hover{color:#fff}
nav.tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--lemon)}
:focus-visible{outline:2px solid var(--lemon);outline-offset:2px}
main{padding:44px 0 80px}

/* section */
.sec{margin:0 0 52px}
.sec:last-child{margin-bottom:0}
.sh{display:flex;align-items:center;gap:8px;margin:0 0 18px}
.sh h2{font-size:1.3rem;display:flex;align-items:center;gap:8px;background:linear-gradient(transparent 62%,var(--lemon) 62%);padding:0 4px}
.sh h2 .ic{color:var(--ink-2)}
.sh .more{margin-left:auto;font-size:.82rem;color:var(--ink-2)}
.lead{color:var(--ink-2);margin:-8px 0 20px;font-size:.92rem}

/* info */
.infobtn{background:transparent;border:1px solid transparent;color:var(--ink-2);border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.infobtn:hover{color:var(--ink);border-color:var(--line)}
.infobtn[aria-expanded="true"]{color:var(--lemon-ink);border-color:var(--lemon);background:var(--lemon-tint)}
.infobtn.hd{position:absolute;top:0;right:20px;width:40px;height:40px;z-index:5}
.infobtn.tab{width:32px;height:32px}
.infopanel{text-align:left;position:absolute;top:46px;right:20px;z-index:20;width:min(420px,calc(100% - 40px));max-height:min(70vh,560px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:18px 20px;font-size:.86rem;line-height:1.7}
.infopanel h3{font-size:1rem;margin:0 0 6px}
.infopanel p{margin:0 0 12px;color:var(--ink-2)}
.infopanel .close{position:sticky;top:0;float:right;font-size:.8rem;background:var(--paper);border:1px solid var(--line);border-radius:4px;color:var(--ink-2);padding:2px 8px;cursor:pointer}
.iclegend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:.8rem}
.iclegend div{display:flex;align-items:center;gap:8px}
.iclegend .ic{color:var(--ink-2)}
.tabinfo{text-align:left;position:absolute;z-index:30;width:min(380px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:14px 18px;margin:0;font-size:.84rem;color:var(--ink-2)}
.tabinfo::before{content:"";position:absolute;top:-6px;left:var(--ax,20px);width:10px;height:10px;background:var(--paper);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.tabinfo p{margin:0 0 6px}.tabinfo p:last-child{margin:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;line-height:1.5;padding:2px 8px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.chip .ic{width:13px;height:13px;stroke-width:2}
.chip.k-band{color:var(--band)}
.chip.k-solo{color:var(--solo)}
.chip.k-copy{color:var(--copy)}
.chip.k-cancel{color:var(--cancel)}
.chip.lemon{background:var(--lemon-tint);color:var(--lemon-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.src{display:inline-flex;align-items:center;font-size:.72rem;color:var(--ink-2);border-radius:4px;padding:1px 6px;background:var(--paper-2);white-space:nowrap}
.src:hover{color:var(--ink)}
.none{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2);background:transparent;border:1px dashed var(--line);border-radius:999px;padding:2px 10px}

/* top */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 26px}
.stat .n{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.2rem);line-height:1;font-weight:500}
.stat .n small{font-size:.38em;margin-left:3px;color:var(--ink-2)}
.stat .l{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-2);margin-top:6px}
.stat .d{font-size:.74rem;color:var(--ink-2);margin-top:2px}
.eraband{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:0 0 10px}
.eraband span{display:block;height:100%}
.eralegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 14px;font-size:.78rem;color:var(--ink-2)}
.eralegend div{display:flex;align-items:center;gap:6px}
.eralegend i{width:8px;height:8px;border-radius:2px;flex:none}
.toprow{display:block;margin-bottom:52px}
.intro{font-size:.95rem;line-height:1.9;color:var(--ink-2);max-width:36em;margin:0 0 34px}
.intro p{margin:0 0 .7em;line-break:strict}
.ps{display:inline-block}
.infobox{background:var(--paper-2);border-radius:10px;padding:16px 18px;font-size:.86rem}
.infobox h3{font-size:1.05rem;margin:0 0 10px}
.infobox dl{display:grid;grid-template-columns:6.2em 1fr;gap:8px 12px;margin:0}
.infobox dt{color:var(--ink-2);font-size:.78rem;padding-top:2px}
.infobox dd{margin:0}
.infobox dd span{display:block}
@media (max-width:760px){.toprow{grid-template-columns:1fr;gap:0}.toprow .infobox{order:-1;margin-bottom:34px}}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rank li a{display:grid;grid-template-columns:28px 1fr 34%;gap:12px;align-items:center;padding:8px 6px;border-radius:8px}
.rank li a:hover{background:var(--paper-2);color:inherit}
.rank .no{font-family:var(--display);font-size:1.15rem;color:var(--ink-2);text-align:center}
.rank .t{font-weight:500}
.bar{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--ink-2)}
.bar .track{flex:1;height:8px;background:var(--paper-3);border-radius:999px;overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.bar .track i.b{background:var(--band)}
.bar .track i.s{background:var(--solo);opacity:.55}
.bar .v{min-width:2.4em;text-align:right}
.nights{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.nights{grid-template-columns:1fr}}
.night{background:var(--paper-2);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.night .cap{grid-column:1/-1;font-size:.76rem;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:6px}

/* date block */
.db{display:grid;justify-items:center;width:56px;padding:6px 0;border-radius:8px;background:var(--paper);line-height:1.1}
.db .m{font-size:.68rem;color:var(--ink-2)}
.db .d{font-family:var(--display);font-size:1.45rem;font-weight:500}
.db .y{font-size:.68rem;color:var(--ink-2)}
.vn{font-weight:700;font-size:1rem;line-height:1.35}
.tt{font-size:.82rem;color:var(--ink-2);line-height:1.45;margin-top:2px}

/* release grid */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.rtile{display:block}
.rtile .face{aspect-ratio:1/1;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--ink);position:relative;overflow:hidden}
.rtile .face .ty{position:absolute;left:10px;bottom:8px;font-size:.68rem;color:var(--ink-2)}
.rtile:hover .face{outline:2px solid var(--lemon)}
.rtile .t{font-weight:500;margin-top:8px;line-height:1.35;font-size:.92rem}
.rtile .y{font-size:.78rem;color:var(--ink-2)}
.f-ep,.f-mini,.f-album{background:color-mix(in srgb,var(--lemon) 35%,var(--paper))}
.f-photobook{background:color-mix(in srgb,var(--chick,var(--lemon)) 30%,var(--paper))}
.chip.k-stream{color:var(--stream)}
.chip.k-plan{color:var(--plan)}
.f-cd{background:color-mix(in srgb,var(--lemon) 30%,var(--paper))}
.f-single{background:color-mix(in srgb,var(--band) 22%,var(--paper))}
.f-demo{background:color-mix(in srgb,var(--solo) 22%,var(--paper))}
.f-compilation{background:color-mix(in srgb,var(--copy) 24%,var(--paper))}
.f-digital{background:color-mix(in srgb,var(--band) 10%,var(--paper-2))}
.f-mv{background:color-mix(in srgb,var(--ink) 12%,var(--paper))}
@media (max-width:420px){.rgrid{grid-template-columns:repeat(2,1fr);gap:18px 12px}}

/* release detail */
.rhead{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:end;margin-bottom:26px}
.rhead .face{aspect-ratio:1/1;border-radius:8px;display:flex;align-items:center;justify-content:center}
.rhead h2{font-size:1.7rem}
@media (max-width:480px){.rhead{grid-template-columns:96px 1fr;gap:14px}.rhead h2{font-size:1.3rem}}
.kv{display:grid;grid-template-columns:7em 1fr;gap:10px 16px;margin:0 0 28px;font-size:.9rem}
.kv dt{color:var(--ink-2);font-size:.78rem;padding-top:3px}
.kv dd{margin:0}
@media (max-width:480px){.kv{grid-template-columns:5.6em 1fr}}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;color:var(--ink-2);word-break:break-all}

/* vertical chain */
.chain{list-style:none;margin:0;padding:0 0 0 4px}
.chain li{position:relative;padding:0 0 18px 30px}
.chain li::before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:2px;background:var(--paper-3)}
.chain li:last-child::before{display:none}
.chain .dot{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.chain .dot .ic{width:13px;height:13px;stroke-width:2}
.chain li.st-first .dot{background:var(--lemon-tint);color:var(--lemon-ink)}
.chain li.st-night .dot,.chain li.st-handout .dot,.chain li.st-done .dot{color:var(--band)}
.chain li.st-recording .dot{color:var(--solo)}
.chain .row{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.chain .lb{font-weight:500}
.chain .dt{font-size:.8rem;color:var(--ink-2)}
.chain details summary{list-style:none;cursor:pointer}
.chain details summary::-webkit-details-marker{display:none}
.chain .more{font-size:.82rem;color:var(--ink-2);margin-top:4px;line-height:1.6}

/* expanding rows */
details.x summary{list-style:none;cursor:pointer}
details.x summary::-webkit-details-marker{display:none}
.caret{width:14px;height:14px;color:var(--ink-2);transition:transform .15s}
details[open] > summary .caret{transform:rotate(90deg)}

/* timeline */
.yr{font-family:var(--display);font-size:1.6rem;color:var(--ink-2);margin:34px 0 8px}
.yr:first-of-type{margin-top:0}
.tl{list-style:none;margin:0;padding:0}
.tl > li > details > summary, .tl > li.era{display:grid;grid-template-columns:24px 78px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:6px}
.tl > li > details > summary:hover{background:var(--paper-2)}
.tl .ic{color:var(--ink-2)}
.tl .d{font-size:.82rem;color:var(--ink-2)}
.tl .h{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl li.live .h{color:var(--ink-2)}
.tl li.era{background:var(--lemon-tint);margin:10px 0}
.tl li.era .h{font-weight:700;color:var(--lemon-ink);white-space:normal}
.tl li.era .h small{font-weight:400;font-size:.74rem;margin-left:10px;color:var(--ink-2)}
.tl li.era .en{display:block;font-weight:400;font-size:.78rem;color:var(--ink-2);margin-top:2px}
.tl .body{padding:2px 6px 14px 118px;font-size:.84rem;color:var(--ink-2);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
@media (max-width:520px){
  .tl > li > details > summary, .tl > li.era{grid-template-columns:22px 66px 1fr 14px;gap:8px}
  .tl .body{padding-left:36px}
}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;align-items:center}
.filters button{font-size:.8rem;border:0;background:var(--paper-2);color:var(--ink-2);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters button .ic{width:14px;height:14px}
.count{font-size:.78rem;color:var(--ink-2);margin:6px 0 0}

/* lives */
.eh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:38px 0 12px}
.eh h3{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.eh h3 .ic{color:var(--ink-2)}
.eh .r{font-size:.78rem;color:var(--ink-2)}
.lcards{display:grid;gap:10px}
details.lc{background:var(--paper-2);border-radius:10px}
details.lc > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:12px 14px}
details.lc > summary::-webkit-details-marker{display:none}
details.lc > summary:hover .vn{color:var(--lemon-ink)}
details.lc .co{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
details.lc .chip,details.lc .src{background:var(--paper)}
.night .db{background:var(--paper)}
details.lc .lbody{padding:0 16px 16px 86px;display:grid;gap:14px;font-size:.88rem}
details.lc .lbody h4{margin:0 0 4px;font-size:.74rem;color:var(--ink-2);font-weight:500}
ol.set{margin:0;padding:0;list-style:none;counter-reset:s}
ol.set li{counter-increment:s;display:flex;gap:10px;padding:3px 0}
ol.set li::before{content:counter(s);width:1.6em;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
@media (max-width:520px){details.lc .lbody{padding-left:16px} details.lc > summary{gap:12px;grid-template-columns:52px 1fr 14px}}

/* songs table */
.stbl{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:minmax(0,1.5fr) 92px minmax(0,1fr);gap:16px;align-items:center;padding:10px 8px;border-radius:8px}
a.srow:hover{background:var(--paper-2);color:inherit}
.srow.hd{font-size:.72rem;color:var(--ink-2);padding-top:0;padding-bottom:4px}
.srow .t{font-weight:500;display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:10px;align-items:center}
.srow .tt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.srow .ri{display:flex;justify-content:flex-start}
.srow .rel{display:inline-flex;gap:4px;color:var(--ink-2)}
.srow .rel .ic{width:15px;height:15px}
.srow .f{font-size:.82rem;color:var(--ink-2)}
@media (max-width:520px){
  .srow{grid-template-columns:minmax(0,1fr) 56px 32%;gap:4px 10px}
  .srow .t{display:contents}
  .srow .tt{grid-column:1;grid-row:1}
  .srow .ri{grid-column:2;grid-row:1/3;align-self:center}
  .srow .f{grid-column:1;grid-row:2;font-size:.74rem}
  .srow .bar{grid-column:3;grid-row:1/3}
  .srow.hd .t{display:none}.srow.hd::before{content:"曲名";grid-column:1}
  .srow.hd .f{display:none}
}
.keybar{display:flex;gap:14px;font-size:.74rem;color:var(--ink-2);margin:0 0 10px}
.keybar i{display:inline-block;width:14px;height:8px;border-radius:999px;margin-right:5px;vertical-align:0}

/* song page */
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:18px;font-size:.84rem;color:var(--ink-2)}
.ph{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 10px}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:.88rem}
.notes li{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.apps{list-style:none;margin:0;padding:0}
.apps li a{display:grid;grid-template-columns:78px 20px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:6px;font-size:.88rem}
.apps li a:hover{background:var(--paper-2);color:inherit}
.apps .pos{font-size:.74rem;color:var(--ink-2)}
@media (max-width:520px){.apps li a{grid-template-columns:66px 18px 1fr auto;gap:8px}}

/* members */
.mt{overflow-x:auto;margin:0 0 14px}
.mt .grid{min-width:560px}
.mt .axis{position:relative;height:20px;margin-left:7.5em;font-size:.7rem;color:var(--ink-2)}
.mt .axis span{position:absolute;top:0;transform:translateX(-50%)}
.mt .row{display:grid;grid-template-columns:7.5em 1fr;align-items:center;padding:9px 0}
.mt .nm{font-size:.92rem;font-weight:500}
.mt .nm small{display:block;color:var(--ink-2);font-size:.72rem;font-weight:400}
.mt .lane{position:relative;height:16px;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/6.17 - 1px),var(--paper-3) calc(100%/6.17 - 1px) calc(100%/6.17))}
.mt .sp{position:absolute;top:2px;height:12px;border-radius:999px;background:var(--band)}
.mt .sp.sup{background:transparent;border:1.5px dashed var(--band)}
.mt .sp.unk{background:linear-gradient(90deg,transparent,var(--band) 45%)}
.mt .sp.pt{width:8px!important;min-width:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-2);margin:0 0 12px}

/* ---------- 曲の並べ替え ---------- */
let songSort='count';
const SSORT=[['count','演奏回数が多い順'],['first','初演が古い順'],['last','最近やった順'],['name','曲名順']];
const lastDate=s=>s.performances.length?s.performances[s.performances.length-1].date:'';
function sortSongs(){ const a=songs.slice();
  if(songSort==='count') a.sort((x,y)=>(y.band_performances+y.solo_performances)-(x.band_performances+x.solo_performances)||(y.band_performances-x.band_performances));
  else if(songSort==='last') a.sort((x,y)=>lastDate(y)<lastDate(x)?-1:lastDate(y)>lastDate(x)?1:0);
  else if(songSort==='name') a.sort((x,y)=>x.title.localeCompare(y.title,'ja'));
  return a; }
document.addEventListener('click',e=>{ const b=e.target.closest('button[data-ss]'); if(!b) return; songSort=b.dataset.ss; const y=scrollY; render(); scrollTo(0,y); });

/* ---------- 今日は何の日 ---------- */
const pad2=n=>String(n).padStart(2,'0');
function anniv(days){ const now=new Date(), out=[];
  for(let k=0;k<=days;k++){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k); const key=pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    lives.filter(l=>l.date.slice(5)===key&&+l.date.slice(0,4)<d.getFullYear()&&l.kind!=='plan').forEach(l=>out.push({l,k,ago:d.getFullYear()-l.date.slice(0,4)})); }
  return out; }
function onThisDay(){
  const today=anniv(0), soon=anniv(7).filter(x=>x.k>0).slice(0,4);
  const li=x=>`<li><a href="#live-${x.l.id}"><span class="d num">${x.k?fd(x.l.date).slice(5)+'（'+x.k+'日後）':'今日'}</span>${ic(KIND_ICON[x.l.kind],'s')}<span>${x.ago}年前 ${esc(x.l.venue||'会場不明')}${x.l.title?`<span class="sm">　${esc(x.l.title)}</span>`:''}</span></a></li>`;
  const body = today.length ? `<ul class="otd">${today.map(li).join('')}</ul>` : `<p class="sm">今日の日付のライブは記録にありません。</p>`;
  return `<div class="sec"><div class="sh"><h2>${ic('clock','l')}今日は何の日</h2></div>${body}${soon.length?`<h3 class="sub" style="margin-top:14px">この先1週間</h3><ul class="otd">${soon.map(li).join('')}</ul>`:''}</div>`;
}

/* ---------- 年表 ---------- */
let tlShowLives = true;
function vTimeline(){
  const items = timeline.filter(t=>tlShowLives || t.type!=='live');
  let out = sh('timeline','clock','年表') + `<div class="filters"><button type="button" data-tl="1" aria-pressed="${tlShowLives}">${ic('mic')}ライブ</button><span class="count num">${items.length}件</span></div>`;
  let year='';
  items.forEach(t=>{
    const y=t.date.slice(0,4);
    if(y!==year){ if(year) out+='</ul>'; year=y; out+=`<div class="yr num">${y}</div><ul class="tl">`; }
    if(t.type==='era'){ { const e=ERA[t.era]; out+=`<li class="era" data-era="${t.era}">${ic(ERA_ICON[t.era])}<span class="d num">${fd(t.date).slice(5)}</span><span class="h">${esc(t.text)}<small class="num">${e?fd(e.from)+' – '+fd(e.to):''}</small>${t.note?`<span class="en">${esc(t.note)}</span>`:''}</span><span></span></li>`; } return; }
    if(t.type==='live'){
      const L=LIVE[t.live_id];
      out+=`<li class="live"><details class="x"><summary>${ic(KIND_ICON[L.kind])}<span class="d num">${fd(t.date).slice(5)}</span><span class="h">${esc(L.venue||L.title||'会場不明')}</span>${caret}</summary><div class="body">${chip(L.kind)}<span>${esc(L.title||'')}</span><a href="#live-${L.id}">ライブ詳細 →</a>${src(t.src_url)}</div></details></li>`;
      return;
    }
    const tic = t.type==='member' ? memberIcon(t.text) : (t.type==='recording' && /MIX/.test(t.text) ? 'mix' : (TYPE_ICON[t.type]||'flag'));
    out+=`<li><details class="x"><summary>${ic(tic)}<span class="d num">${fd(t.date).slice(5)}</span><span class="h">${esc(short(t.text))}</span>${caret}</summary><div class="body"><span class="chip">${esc(TYPE[t.type]||t.type)}</span><span>${esc(t.text)}</span>${src(t.src_url)}</div></details></li>`;
  });
  return out+'</ul>';
}

/* ---------- 曲 ---------- */
function vSongs(){
  const rows = sortSongs().map(s=>{
    const f=s.first_recorded_performance;
    return `<a class="srow" href="#song-${s.id}"><span class="t"><span class="tt">${esc(s.title)}${s.solo_only?`<span class="chip lemon">${ic('guitar')}弾き語りのみ</span>`:''}</span><span class="ri">${relIcons(s)}</span></span><span class="f num">${songSort==='last'?(lastDate(s)?fd(lastDate(s)):'—'):(f?fd(f.date):'—')}</span>${bar(s)}</a>`;

  <div class="stbl"><div class="srow hd"><span class="t"><span>曲名</span><span>収録</span></span><span class="f">${songSort==='last'?'最後に演奏':'初演（記録上）'}</span><span>演奏回数</span></div>${rows}</div>${setTrends()}`;
}
function setTrends(){
  const ls=lives.filter(l=>(l.kind==='band'||l.kind==='stream')&&l.setlist.length>=3);
  const cnt=pick=>{ const c={}; ls.forEach(l=>{ const s=pick(l); if(s&&s.song_id) c[s.song_id]=(c[s.song_id]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5); };
  const rank=(title,icon,arr)=>`<div class="tr"><h3 class="sub">${ic(icon,'s')} ${title}</h3><ol class="trk">${arr.map(([id,n])=>`<li><a href="#song-${id}">${esc(SONG[id].title)}</a><span class="num sm">${n}回</span><i style="width:${(n/ls.length*100).toFixed(1)}%"></i></li>`).join('')}</ol></div>`;
  const t0=+new Date(meta.period.from), t1=+new Date(meta.period.to), X=d=>((+new Date(d))-t0)/(t1-t0)*100;
  const Y0=+meta.period.from.slice(0,4), Y1=+meta.period.to.slice(0,4), ys=[]; for(let y=Y0;y<=Y1;y++) ys.push(y);
  const life=songs.filter(s=>s.performances.length).map(s=>{ const p=s.performances, a=p[0].date, z=p[p.length-1].date;
    return `<a class="lrow" href="#song-${s.id}"><span class="ln">${esc(s.title)}<small class="num">${p.length}</small></span><span class="lane">${ys.map(y=>`<i class="gl" style="left:${Math.max(0,X(y+'-01-01')).toFixed(2)}%"></i>`).join('')}<i class="span" style="left:${X(a).toFixed(2)}%;width:${Math.max(.4,X(z)-X(a)).toFixed(2)}%"></i>${p.map(x=>`<i class="tk${LIVE[x.live_id].kind==='solo'?' so':''}" style="left:${X(x.date).toFixed(2)}%"></i>`).join('')}</span></a>`; }).join('');
  return `<div class="sec" style="margin-top:44px"><div class="sh"><h2>${ic('list','l')}セトリの傾向</h2></div>
  <p class="lead">セトリが3曲以上残っているバンドのライブ ${ls.length}本から数えています。</p>
  <div class="trs">${rank('1曲目','play',cnt(l=>l.setlist[0]))}${rank('最後の曲（アンコール含む）','flag',cnt(l=>l.setlist[l.setlist.length-1]))}${rank('2曲目','next',cnt(l=>l.setlist[1]))}</div>
  <h3 class="sub" style="margin-top:28px">${ic('clock','s')} 曲の寿命（初演から最新まで）</h3><p class="sm" style="margin:0 0 8px">帯が初演〜最新の演奏、縦線が1回ずつの演奏（金色は弾き語り）。数字は演奏回数。</p>
  <div class="life"><div class="lrow lax"><span></span><span class="lane">${ys.map(y=>`<b style="left:${Math.max(2,X(y+'-01-01')).toFixed(2)}%">${String(y).slice(2)}</b>`).join('')}</span></div>${life}</div></div>`;
}

function dotPlot(mode){
  const y0=+meta.period.from.slice(0,4), y1=+meta.period.to.slice(0,4), cols=[];
  const PAL=["#f2d81c", "#2f5f8a", "#6a5a8c", "#c0733c", "#4c9a8a"], OTH='#d6d1dc';
  const vc={}; lives.forEach(l=>{ if(l.venue) vc[l.venue]=(vc[l.venue]||0)+1; });
  const top=Object.entries(vc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const col=l=>mode==='venue'?(top.includes(l.venue)?PAL[top.indexOf(l.venue)]:OTH):ERA_COLORS[l.era];
  for(let y=y0;y<=y1;y++){
    const ls=lives.filter(l=>l.date.startsWith(y)).slice().sort((a,b)=>a.date<b.date?-1:1);
    cols.push(`<div class="dcol"><div class="dstack">${ls.map((l,i)=>`<a class="dot" href="#live-${l.id}" data-id="${l.id}" style="background:${col(l)};--i:${i}" aria-label="${esc(fd(l.date))} ${esc(l.venue||l.title||'')}"></a>`).join('')}</div><small class="dn num">${ls.length||''}</small><span class="num">${y}</span></div>`);
  }
  const lg=mode==='venue'?`<div class="dleg">${top.map((v,i)=>`<span><i style="background:${PAL[i]}"></i>${esc(v)}</span>`).join('')}<span><i style="background:${OTH}"></i>その他・不明</span></div>`:'';

}

let DB=null, ASSETS=null, ITEMS=[], MARKS={}, dbState='loading', boxFilter='todo';
const KKEY={'映像':'video','写真':'photo','フライヤー':'flyer','セトリ':'setlist','音源':'audio','ジャケット':'jacket','クレジット':'credit','歌詞':'lyrics','コード':'chord','デモ':'demo'};
const MLABEL={pc:'pCloudにある',skip:'不要',none:'存在しない'};

function gallery(slotId){

function markBtns(id,k,ro){

async function saveSlot(form){

function fx(){
  const main=document.getElementById('main');
  if(tintHandler){ window.removeEventListener('scroll',tintHandler); tintHandler=null; }
  if(fxIO){ fxIO.disconnect(); fxIO=null; }
  const mEl=document.querySelector('main'); mEl.style.backgroundColor='';
  if(REDUCED) return;
  main.classList.remove('fade'); void main.offsetWidth; main.classList.add('fade');
  // カウントアップ
  main.querySelectorAll('.stat .n').forEach(n=>{
    const tn=[...n.childNodes].find(x=>x.nodeType===3); if(!tn) return;
    const to=parseInt(tn.nodeValue,10); if(!to) return; const t0=performance.now(), D=900;
    const step=t=>{ const p=Math.min(1,(t-t0)/D); tn.nodeValue=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); };
    tn.nodeValue='0'; requestAnimationFrame(step);
  });
  // 時代帯・在籍バー・演奏回数バーの遅延
  main.querySelectorAll('.eraband span').forEach((s,i)=>s.style.setProperty('--i',i));
  main.querySelectorAll('.mt .row').forEach((r,i)=>r.style.setProperty('--r',i));
  main.querySelectorAll('.rank li, .stbl .srow').forEach((r,i)=>r.style.setProperty('--r',Math.min(i,14)));
  // スクロールで出現
  fxIO=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); fxIO.unobserve(e.target); } }),{rootMargin:'0px 0px -8% 0px'});
  main.querySelectorAll('.rtile,.sec,.lcards > *,.eh,.tl li.era,.yr,.dots').forEach((el,i)=>{ el.classList.add('rv'); fxIO.observe(el); });
  // 年表：スクロールで時代色
  const eras=[...main.querySelectorAll('.tl li.era')];
  if(eras.length){
    let cur='';
    tintHandler=()=>{
      const mid=innerHeight*.45; let id='';
      eras.forEach(e=>{ if(e.getBoundingClientRect().top<mid) id=e.dataset.era; });
      if(id===cur) return; cur=id;
      const col=id?ERA_COLORS[id]:''; mEl.style.backgroundColor = col?`color-mix(in srgb, ${col} 9%, #fff)`:'';
    };
    window.addEventListener('scroll',tintHandler,{passive:true}); tintHandler();
  }
  // メンバー：行をタップで強調
  main.querySelectorAll('.mt .row').forEach(r=>{
    const go=()=>{ const on=!r.classList.contains('on'); main.querySelectorAll('.mt .row').forEach(x=>x.classList.remove('on')); main.querySelector('.mt').classList.toggle('focus',on); if(on) r.classList.add('on'); };

  });
}

ipanel.innerHTML=`<button type="button" class="close" id="info-close">閉じる</button>
  <h3>このページについて</h3>
  <p>檸檬をかじる彼女（2014〜2020、名古屋）の記録です。メンバーの X とブログ「lemokanoの日記」に残っているものから作りました。</p>
  <p>事実には出典（元のポストやブログ）を付けています。分からないことは「不明」のままにしています。</p>
  <p>公演と共演者の一部は、新栄SiX-DOG の公式スケジュール（Wayback Machine から復元）とつないでいます。</p>
  <h3>記号の意味</h3>
  <div class="iclegend">${LEGEND.map(([n,l])=>`<div>${ic(n)}<span>${esc(l)}</span></div>`).join('')}</div>`;
const setPanel=open=>{ ipanel.hidden=!open; ibtn.setAttribute('aria-expanded',String(open)); };
ibtn.addEventListener('click',e=>{ e.stopPropagation(); setPanel(ipanel.hidden); });
ipanel.addEventListener('click',e=>{ if(e.target.id==='info-close'){ setPanel(false); ibtn.focus(); } e.stopPropagation(); });
const placePop=(btn,p)=>{ const r=btn.getBoundingClientRect(), W=document.documentElement.clientWidth, w=Math.min(380,W-32); const op=p.offsetParent||document.body, o=op.getBoundingClientRect(); let left=r.left+r.width/2-w/2; left=Math.max(16,Math.min(left,W-w-16)); p.style.left=(left-o.left)+'px'; p.style.top=(r.bottom-o.top+10)+'px'; p.style.setProperty('--ax',(r.left+r.width/2-left-5)+'px'); };
const closeTabInfos = except => document.querySelectorAll('button.infobtn.tab[aria-expanded="true"]').forEach(b=>{ if(b===except) return; b.setAttribute('aria-expanded','false'); const p=document.getElementById(b.getAttribute('aria-controls')); if(p) p.hidden=true; });
document.addEventListener('click',e=>{
  if(!ipanel.hidden && !ipanel.contains(e.target)) setPanel(false);
  const tb=e.target.closest('button.infobtn.tab');
  if(tb){ closeTabInfos(tb); const p=document.getElementById(tb.getAttribute('aria-controls')); const open=p.hidden; p.hidden=!open; tb.setAttribute('aria-expanded',String(open)); if(open) placePop(tb,p); }
  else if(!e.target.closest('.tabinfo')) closeTabInfos(null);
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!ipanel.hidden){ setPanel(false); ibtn.focus(); } closeTabInfos(null); });
render();
})();
</script>
</body>
</html>
