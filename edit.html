<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>バンドの方の編集ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2; --card:#ffffff; --ink:#18181a; --ink-2:#64646a; --line:#e3e1da; --soft:#efede6;
  --accent:#d4531f; --accent-ink:#9c3a12; --accent-tint:#fbe9df; --ok:#2e7d4f; --err:#b3261e;
  --sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  --head:"Space Grotesk","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141416; --card:#1d1d20; --ink:#ecebe6; --ink-2:#a3a29c; --line:#2f2f33; --soft:#26262a;
  --accent:#f0804e; --accent-ink:#f5a37d; --accent-tint:#3a2419; --ok:#6fcf97; --err:#f2b8b5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141416; --card:#1d1d20; --ink:#ecebe6; --ink-2:#a3a29c; --line:#2f2f33; --soft:#26262a;
  --accent:#f0804e; --accent-ink:#f5a37d; --accent-tint:#3a2419; --ok:#6fcf97; --err:#f2b8b5; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--line);background:var(--card);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px}
.logo{font-family:var(--head);font-weight:700;text-decoration:none}
.me{margin-left:auto;font-size:.82rem;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{padding-block:24px 64px;overflow-wrap:anywhere}
h1{font-family:var(--head);font-size:clamp(1.4rem,4vw,1.9rem);margin:0 0 8px;text-wrap:balance}
h2{font-size:1.05rem;margin:28px 0 10px}
.lead{color:var(--ink-2);max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:.85rem;color:var(--ink-2);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:110px;resize:vertical}
.row{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row>*{min-width:0}
button{font:inherit;cursor:pointer;border-radius:999px;padding:8px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button.danger{color:var(--err);border-color:var(--err)}
button:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:12px;align-items:flex-start}
.list li>div{flex:1;min-width:0}
.list .d{font-family:var(--head);font-size:.9rem;color:var(--ink-2);white-space:nowrap}
.list .m{font-size:.82rem;color:var(--ink-2)}
.msg{padding:10px 14px;border-radius:8px;margin:12px 0;font-size:.9rem}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ok)}
.msg.err{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err)}
.note{font-size:.82rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2);margin-left:6px}
.hist{font-size:.82rem}
.hist li{display:block}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="./">ライブハウスとバンドの記録</a>
  <div class="me" id="me"></div>
</div></header>
<main class="wrap" id="app"><p class="note">読み込んでいます…</p></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
const CFG = window.SITE_CONFIG;
const app = document.getElementById("app"), me = document.getElementById("me");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KIND = {band:"バンド", solo:"弾き語り", copy:"コピー", stream:"配信", cancel:"中止", plan:"予定"};
const ERR = {not_allowed:"このメールアドレスは、このバンドの編集できる人として登録されていません。", not_your_act:"このライブは編集できません。",
             date_required:"日付を入れてください。"};
const errText = e => { const m = (e && (e.message || e.error_description)) || String(e); const k = Object.keys(ERR).find(k => m.includes(k)); return k ? ERR[k] : m; };
if (!window.supabase){ app.innerHTML = `<p class="msg err">部品を読み込めませんでした。時間をおいて開き直してください。</p>`; return; }
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.publishableKey, {auth:{persistSession:true, detectSessionInUrl:true, flowType:"implicit"}});
let ME = null, BANDS = [], CUR = null, DATA = null, flash = null;

async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args || {}); if (error) throw error; return data; }

// ---------------------------------------------------------------- ログイン
function vLogin(sent){
  me.innerHTML = "";
  app.innerHTML = `<h1>バンドの方の編集ページ</h1>
  <p class="lead">バンドのメンバーが、自分たちのライブの記録（日付・会場・対バン・セトリなど）を足したり直したりするページです。登録したメールアドレスでログインしてください。</p>
  <div class="card" style="max-width:480px">
    ${sent ? `<p class="msg ok">${esc(sent)} にログイン用のリンクを送りました。メールのリンクを開くと、このページに戻ってきます。</p>` : ""}
    <form id="lf"><label>メールアドレス<input type="email" name="email" required autocomplete="email"></label>
    <div class="btns"><button class="primary" type="submit">ログイン用のリンクを送る</button></div></form>
    <p class="note">パスワードは要りません。届かないときは迷惑メールのフォルダも見てください。編集できる人として登録されていないアドレスでは、ログインしても編集できません。</p>
  </div>`;
  document.getElementById("lf").addEventListener("submit", async e => {
    e.preventDefault(); const email = e.target.email.value.trim(); const b = e.target.querySelector("button"); b.disabled = true;
    const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname, shouldCreateUser:true}});
    if (error){ b.disabled = false; app.querySelector(".card").insertAdjacentHTML("afterbegin", `<p class="msg err">送れませんでした：${esc(errText(error))}</p>`); return; }
    vLogin(email);
  });
}

// ---------------------------------------------------------------- 一覧
async function start(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return vLogin();
  ME = session.user;
  me.innerHTML = `<span>${esc(ME.email)}</span><button id="lo">ログアウト</button>`;
  document.getElementById("lo").onclick = async () => { await sb.auth.signOut(); location.hash = ""; vLogin(); };
  try { BANDS = await rpc("ed_my_artists"); } catch(e){ app.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`; return; }
  if (!BANDS.length){ app.innerHTML = `<h1>編集できるバンドがありません</h1><p class="lead">このメールアドレス（${esc(ME.email)}）は、まだどのバンドの編集できる人としても登録されていません。サイトの管理人に、登録してほしいメールアドレスを伝えてください。</p>`; return; }
  CUR = CUR && BANDS.find(b => b.id === CUR.id) || BANDS[0];
  await loadBand();
}
async function loadBand(){
  app.innerHTML = `<p class="note">読み込んでいます…</p>`;
  try { DATA = await rpc("ed_lives", {p_artist: CUR.id}); } catch(e){ app.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`; return; }
  vList();
}
function vList(){
  const pub = CUR.publish === "full" ? `<a href="${CUR.slug ? "artists/" + esc(CUR.slug) + "/" : "./"}">公開ページ</a>に出ています。` : "このバンドのページはまだ公開していないので、直した内容は公開ページには出ません。";
  app.innerHTML = `${BANDS.length > 1 ? `<label style="max-width:320px">バンド<select id="bs">${BANDS.map(b => `<option value="${b.id}" ${b.id === CUR.id ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select></label>` : ""}
  <h1>${esc(CUR.name)} のライブ</h1>
  <p class="lead">${DATA.lives.length}本。${pub}直した内容は、同じ日に同じ会場に出たほかのバンドの記録にもつながります。</p>
  ${flash ? `<p class="msg ${flash[0]}">${esc(flash[1])}</p>` : ""}
  <div class="btns"><button class="primary" id="add">＋ ライブを足す</button><button id="hist">直した履歴</button></div>
  <div id="histbox"></div>
  <h2>一覧</h2>
  <ul class="list">${DATA.lives.map((l, i) => `<li><span class="d">${esc(l.date)}</span><div>
      <b>${esc(l.venue || "会場不明")}</b>${KIND[l.kind] && l.kind !== "band" ? `<span class="tag">${KIND[l.kind]}</span>` : ""}${!l.src ? `<span class="tag">ほかのバンドの記録から</span>` : ""}
      <div class="m">${esc(l.title || "")}${l.cobands.length ? `　w/ ${esc(l.cobands.slice(0, 8).join("、"))}${l.cobands.length > 8 ? " ほか" : ""}` : ""}</div></div>
      <button data-i="${i}">直す</button></li>`).join("")}</ul>`;
  flash = null;
  const bs = document.getElementById("bs"); if (bs) bs.onchange = () => { CUR = BANDS.find(b => b.id === +bs.value); loadBand(); };
  document.getElementById("add").onclick = () => vForm(null);
  document.getElementById("hist").onclick = vHistory;
  app.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => vForm(DATA.lives[+b.dataset.i]));
  window.scrollTo(0, 0);
}
async function vHistory(){
  const box = document.getElementById("histbox"); box.innerHTML = `<p class="note">読み込んでいます…</p>`;
  try {
    const h = await rpc("ed_history", {p_artist: CUR.id});
    const F = {date:"日付", title:"公演名", open_time:"開場", start_time:"開演", price:"料金", setlist:"セトリ", note:"メモ", kind:"種類", show_id:"公演", source_url:"出典", "*":"行"};
    box.innerHTML = h.length ? `<div class="card"><ul class="list hist">${h.map(x => `<li>${esc(x.at.slice(0,16).replace("T"," "))}　${esc(x.by.replace(/^member:/, ""))}　${x.entity === "arc_shows" ? "公演" : "出演"}の${esc(F[x.field] || x.field)}を${x.op === "insert" ? "追加" : x.op === "delete" ? "削除" : "変更"}</li>`).join("")}</ul></div>`
      : `<p class="note">この半年の直した履歴はありません。</p>`;
  } catch(e){ box.innerHTML = `<p class="msg err">${esc(errText(e))}</p>`; }
}

// ---------------------------------------------------------------- 足す・直す
function vForm(l){
  const v = l || {date:"", venue:"", title:"", open:"", start:"", price:"", kind:"band", cobands:[], setlist:[], note:"", src:""};
  app.innerHTML = `<p><a href="#" id="back">← ${esc(CUR.name)} のライブ</a></p>
  <h1>${l ? "ライブを直す" : "ライブを足す"}</h1>
  ${l && !l.src ? `<p class="msg err" style="background:var(--soft);color:var(--ink-2)">このライブは、ほかのバンドの記録やライブハウスのスケジュールから分かったものです。直すと、この内容が ${esc(CUR.name)} の記録として残ります。</p>` : ""}
  <form id="ef" class="card">
    <div class="row"><label>日付<input type="date" name="date" required value="${esc(v.date)}"></label>
      <label>種類<select name="kind">${Object.entries(KIND).map(([k, t]) => `<option value="${k}" ${v.kind === k ? "selected" : ""}>${t}</option>`).join("")}</select></label></div>
    <label>会場（配信のときは「配信」）<input name="venue" list="vl" value="${esc(v.venue)}" placeholder="例：新栄SiX-DOG"></label>
    <datalist id="vl">${(DATA.venues || []).map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>
    <label>公演名<input name="title" value="${esc(v.title || "")}"></label>
    <div class="row"><label>開場<input name="open" value="${esc(v.open || "")}" placeholder="18:00"></label>
      <label>開演<input name="start" value="${esc(v.start || "")}" placeholder="18:30"></label>
      <label>料金<input name="price" value="${esc(v.price || "")}" placeholder="前売2000円／当日2500円"></label></div>
    <label>対バン（1行に1組）<textarea name="cobands">${esc(v.cobands.join("\n"))}</textarea></label>
    <label>セトリ（1行に1曲）<textarea name="setlist">${esc((v.setlist || []).join("\n"))}</textarea></label>
    <label>メモ<input name="note" value="${esc(v.note || "")}"></label>
    <label>出典の URL（X のポストなど。あれば）<input name="src" type="url" value="${esc(v.src || "")}"></label>
    <p class="note">公演名・時間・料金は、同じ日に同じ会場に出たバンドみんなの記録に効きます。空欄にした項目は消さずに残します。</p>
    <div class="btns"><button class="primary" type="submit">保存する</button>${l ? `<button type="button" class="danger" id="del">このライブを消す</button>` : ""}</div>
    <div id="fm"></div>
  </form>`;
  document.getElementById("back").onclick = e => { e.preventDefault(); vList(); };
  const f = document.getElementById("ef"), fm = document.getElementById("fm");
  const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);
  f.addEventListener("submit", async e => {
    e.preventDefault(); const b = f.querySelector("button.primary"); b.disabled = true;
    const p = {act_id: l ? l.act_id : null, date: f.date.value, venue: f.venue.value.trim(), title: f.title.value.trim(), open: f.open.value.trim(),
      start: f.start.value.trim(), price: f.price.value.trim(), kind: f.kind.value, cobands: lines(f.cobands.value), setlist: lines(f.setlist.value),
      note: f.note.value.trim(), src: f.src.value.trim()};
    try { await rpc("ed_save_live", {p_artist: CUR.id, p}); flash = ["ok", `${p.date} のライブを保存しました。会場・公演・アーティストのページには、開き直すとすぐ出ます。年表やセトリの詳しいページは、管理人がまとめて新しくします。`]; await loadBand(); }
    catch(err){ b.disabled = false; fm.innerHTML = `<p class="msg err">保存できませんでした：${esc(errText(err))}</p>`; }
  });
  const del = document.getElementById("del");
  if (del) del.onclick = () => {
    fm.innerHTML = `<p class="msg err">${esc(v.date)} のライブを消します。よろしいですか？ <button type="button" class="danger" id="yes">消す</button> <button type="button" id="no">やめる</button></p>`;
    document.getElementById("no").onclick = () => { fm.innerHTML = ""; };
    document.getElementById("yes").onclick = async () => {
      try { await rpc("ed_delete_live", {p_artist: CUR.id, p_act: l.act_id}); flash = ["ok", `${v.date} のライブを消しました。`]; await loadBand(); }
      catch(err){ fm.innerHTML = `<p class="msg err">消せませんでした：${esc(errText(err))}</p>`; }
    };
  };
  window.scrollTo(0, 0);
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !ME) start(); });
start();
})();
</script>
</body>
</html>
