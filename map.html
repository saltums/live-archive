<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名古屋ライブアーカイブ</title>
<meta name="description" content="名古屋・新栄と鶴舞のライブハウスの夜。公演があった夜のハコの窓が光ります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 夜の街（斜め俯瞰）を上に、選ぶための段を下に置く1画面の作り */
:root{
  --bg:#0A0F22; --ground:#0D1430; --panel:#101838; --panel-2:#0D1430; --ink:#F2F0E6; --ink-2:#A6AEC6; --lamp:#FFC857; --open:#FF5C7A; --station:#7FB7FF;
  --line:rgba(166,174,198,.22);
  --sans:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  --num:"Space Grotesk","Zen Kaku Gothic New",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#pins{position:fixed;inset:0;pointer-events:none}

/* 地図の上の印（名札は持たない。灯り・入れる・選んだハコだけ短い名前を出す） */
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;
  padding:6px;border:none;background:transparent;white-space:nowrap}
.pin i{width:9px;height:9px;border-radius:50%;background:#59628a;box-shadow:0 0 0 2px rgba(10,15,34,.85);flex:none}
.pin.open i{background:var(--open)}
.pin.lit i{background:var(--lamp);box-shadow:0 0 0 2px rgba(10,15,34,.85),0 0 12px 3px rgba(255,200,87,.75)}
.pin.gone{opacity:.35}
.pin span{font-size:11px;line-height:1;padding:3px 6px;border-radius:6px;background:rgba(10,15,34,.82);border:1px solid var(--line);display:none}
.pin.faint i{background:#8a7440;box-shadow:0 0 0 2px rgba(10,15,34,.85),0 0 6px 1px rgba(255,200,87,.35)}
.pin.lit span,.pin.sel span,.pin.hit span{display:inline-block}
.pin.sel i{outline:2px solid var(--ink);outline-offset:2px}
.pin b{font-family:var(--num);color:var(--lamp);margin-left:3px}
.mark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:11px;white-space:nowrap}
.mark.station{color:var(--station)}
.mark.island{color:var(--ink-2);font-family:var(--num);letter-spacing:.3em}

header{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:flex-start;gap:10px;background:linear-gradient(var(--bg) 55%,rgba(10,15,34,0));z-index:3}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.04em}
header .when{margin-top:2px;font-family:var(--num);font-size:21px;font-weight:700;letter-spacing:.02em}
header .when span{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--lamp);margin-left:6px}
header .sub{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--open);border-color:var(--open);color:#1a0b12;font-weight:700}
.btn:focus-visible,.tab:focus-visible,.shelf button:focus-visible,.pin:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

/* 下の段 */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:linear-gradient(rgba(10,15,34,0),var(--bg) 18px);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;width:max-content}
.tab{border:none;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pane{margin-top:8px;height:118px;overflow:auto}
.tonight .row{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;line-height:1.45;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.tonight .row b{color:var(--lamp);flex:none}
.tonight .row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.none{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.shelf{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.shelf button{flex:none;scroll-snap-align:start;width:132px;min-height:96px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.shelf button .town{font-size:10.5px;color:var(--ink-2);letter-spacing:.08em}
.shelf button b{font-size:13px;line-height:1.3}
.shelf button small{font-size:11px;margin-top:auto}
.shelf button.lit{border-color:rgba(255,200,87,.7)}
.shelf button.lit b::before{content:"● ";color:var(--lamp)}
.shelf button.faint b::before{content:"○ ";color:var(--lamp)}
.tonight .row.faint b{color:#b89a55}
.tonight .row.faint span{color:var(--ink-2)}
.shelf button.gone{opacity:.5}
.find{display:flex;gap:8px}
.find input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
.find input:focus{outline:2px solid var(--lamp);outline-offset:1px}
.hits{margin-top:6px;display:flex;flex-direction:column}
.hits button{background:none;border:none;border-bottom:1px solid var(--line);padding:7px 0;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:13px}
.hits button small{color:var(--ink-2);font-size:11px;flex:none}
.hits button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist-on{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:2px}
.artist-on b{color:var(--lamp)}
.yr{display:flex;align-items:center;gap:10px;margin-top:8px;position:relative}
.yr label{font-size:12px;color:var(--ink-2)}
.yr .track{flex:1;position:relative}
.yr input{width:100%;accent-color:var(--lamp);height:26px;margin:0}
.yr .ticks{position:absolute;left:8px;right:8px;top:-3px;height:4px;pointer-events:none}
.yr .ticks i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--lamp);transform:translateX(-50%)}
.yr output{font-family:var(--num);font-weight:700;font-size:15px;min-width:44px;text-align:right}
.credit{font-size:10px;color:var(--ink-2);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.credit a{color:var(--ink-2)}

/* ハコのカード（下の段の上に重ねる） */
#card{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:6;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-height:62%;overflow:auto;transform:translateY(calc(100% + 30px));transition:transform .28s ease}
#card.on{transform:none}
#card .head{display:flex;gap:10px;align-items:flex-start}
#card h2{margin:0;font-size:17px;line-height:1.3;flex:1}
#card .meta{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5}
#card .st{font-size:12px;font-weight:700}
.st-open{color:var(--open)} .st-staff{color:var(--lamp)} .st-prep{color:var(--ink-2)}
#card .night{margin-top:10px;font-size:13px;line-height:1.55;border-top:1px solid var(--line);padding-top:8px}
#card .who{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px}
#card .who button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);font:inherit;font-size:12px;padding:2px 9px;cursor:pointer}
#card .who button:hover,#card .who button.cur{color:var(--lamp);border-color:var(--lamp)}
#card .night .d{font-family:var(--num);color:var(--ink-2);margin-right:6px}
#card .dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#card .dates button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-family:var(--num);font-size:12px;cursor:pointer}
#card .dates button.cur{border-color:var(--lamp);color:var(--lamp)}
#card .ylist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
#card .ylist summary{cursor:pointer;color:var(--ink);font-weight:700;padding:2px 0}
#card .ylist button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:6px 0;cursor:pointer;align-items:baseline}
#card .ylist button .d{font-family:var(--num);color:var(--ink-2);flex:none;width:38px}
#card .ylist button small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.45}
#card .ylist button.cur .d{color:var(--lamp)}
#card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#card .floors{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#card .floors button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
#card .floors button.cur{border-color:var(--ink)}

#homeBtn{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 96px);padding:6px 11px;font-size:12px}
body.intro #dock .pane, body.intro .tabs{opacity:.35;pointer-events:none}
body.intro header .when{color:var(--lamp)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:9}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:13px}
@media (prefers-reduced-motion: reduce){ #card,#fade{transition:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="pins"></div>
<div id="loading">街の灯りを読み込んでいます…</div>

<header>
  <div class="t">
    <h1>名古屋ライブアーカイブ</h1>
    <div class="when" id="when">—</div>
    <div class="sub" id="sub"></div>
  </div>
  <button class="btn" id="searchBtn" type="button" aria-label="ハコ・組・日付でさがす"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>さがす</button>
</header>

<section id="dock" aria-label="選ぶ">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-tonight" aria-selected="true" data-pane="tonight">今夜</button>
    <button class="tab" role="tab" id="tab-venues" aria-selected="false" data-pane="venues">ハコ</button>
    <button class="tab" role="tab" id="tab-artist" aria-selected="false" data-pane="artist">組・さがす</button>
  </div>
  <div class="pane tonight" id="pane-tonight"></div>
  <div class="pane" id="pane-venues" hidden><div class="shelf" id="shelf"></div></div>
  <div class="pane" id="pane-artist" hidden>
    <div class="find"><input id="q" type="search" placeholder="組の名前・ハコ・日付（2015/8/1）" autocomplete="off"><a class="btn" href="bands.html" style="white-space:nowrap">組の一覧</a></div>
    <div class="artist-on" id="artistOn" hidden></div>
    <div class="hits" id="hits"></div>
  </div>
  <div class="yr"><label for="year">年</label><div class="track"><div class="ticks" id="ticks"></div><input type="range" id="year" min="2000" max="2026" step="1"></div><output id="yearOut">—</output></div>
  <div class="credit"><span>道路 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>・建物 <a href="https://www.mlit.go.jp/plateau/" target="_blank" rel="noopener">国土交通省 PLATEAU</a></span><span>鶴舞は実際（約1.1km南）より近くに置いています</span></div>
</section>

<button class="btn" id="homeBtn" type="button" hidden>⤢ 全体を見る</button>
<div id="card" role="dialog" aria-modal="false" aria-label="ハコ"></div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ---------------------------------------------------------------- 設定
   TOWN_MODE: "public"（共通DB の公開分だけ）／"private"（関係者用。window.TOWN_NIGHTS・TOWN_PUBLIC を先に読み込む） */
const MODE = window.TOWN_MODE || "public";
const TOWN_URL = window.TOWN_URL || "town/town.json";
const VENUE_PAGE = window.VENUE_PAGE || (id => "index.html#venue-" + id);
const ARTIST_PAGE = window.ARTIST_PAGE || (id => "index.html#artist-" + id);
const C = { bg:0x0A0F22, ground:0x0D1430, top:0x1A2450, side1:0x131B40, side2:0x0F1634, vtop:0x2B3670, vside1:0x1E2858, vside2:0x182048,
  lamp:0xFFC857, open:0xFF5C7A, road:0x18214A, rail:0x2A3A70, pick:0x3A4790 };
const WD = "日月火水木金土";
const today = new Date();
const pad = n => String(n).padStart(2, "0");
const TODAY = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const THIS_YEAR = today.getFullYear();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nk = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s\.\-・’'"“”!！ー☆★]/g, "");

let T = null;
const NIGHTS = {};          // ハコ key → Map(日付 → [{title, names}])
const PUBLIC = new Set(), LEDGER = new Set();
const ARTISTS = new Map();  // 組の番号（"#12"。番号のない出演は正規化した名前）→ {name, id, keys:[探すときの名前], hits: Map(ハコ key → [日付…])}
const PAGES = new Map();    // 組の番号 → その組の詳しいページ（専用サイト）の URL
const PUBIDS = new Set();   // 公開サイトにページ（index.html#artist-番号）がある組の番号
const ALIAS = {};           // 組の番号 → ほかの呼び名
const SITE = window.SITE_BASE || "";   // 公開サイトの置き場所（Claude の中のページからは絶対 URL）
const akey = (id, n) => id ? "#" + id : nk(n);
const pageOf = a => !a || !a.id ? null : PAGES.get(a.id) || (PUBIDS.has(a.id) ? ARTIST_PAGE(a.id) : null);
let date = null;            // いま見ている夜（YYYY-MM-DD）
let selected = null;        // 選んでいるハコ key
let artist = null;          // 選んでいる組（ARTISTS の値）

/* ---------------------------------------------------------------- データ */
async function loadData(){
  T = await (await fetch(TOWN_URL)).json();
  for (const v of T.venues){ NIGHTS[v.key] = new Map(); if (v.ledger) LEDGER.add(v.key); }
  const byArc = new Map(T.venues.filter(v => v.arc).map(v => [v.arc, v.key]));
  if (window.TOWN_PUBLIC) for (const k of window.TOWN_PUBLIC) PUBLIC.add(k);
  if (MODE !== "private") try {
    const CFG = window.SITE_CONFIG;
    const r = await fetch(CFG.supabaseUrl + "/rest/v1/rpc/pub_snapshot", {method:"POST",
      headers:{apikey:CFG.publishableKey, Authorization:"Bearer " + CFG.publishableKey, "Content-Type":"application/json"}, body:"{}"});
    const s = await r.json();
    const names = new Map(s.artists.map(a => [a[0], a[1]]));
    for (const a of s.artists){ PUBIDS.add(a[0]); if (a[4]) PAGES.set(a[0], SITE + "artists/" + a[4] + "/"); }
    const acts = new Map();
    for (const a of s.acts){ if (!acts.has(a[1])) acts.set(a[1], []); acts.get(a[1]).push({name:a[3] || names.get(a[2]) || "", id:a[2]}); }
    for (const x of s.shows){
      const k = byArc.get(x[2]); if (!k) continue;
      PUBLIC.add(k);
      const m = NIGHTS[k]; if (!m.has(x[1])) m.set(x[1], []);
      const as = (acts.get(x[0]) || []).filter(a => a.name);
      m.get(x[1]).push({title:x[4] || "", names:as.map(a => a.name), ids:as.map(a => a.id)});
    }
  } catch(e){ console.warn("公開分を読めませんでした", e); }
  // 台帳の分（ハコごとの全公演）。公開の地図は town/nights.json、Claude の中のページは先に読み込んだ window.TOWN_NIGHTS
  // 出演は [組の番号, 表示名] の表（acts）への番号で持つ。共通DB の全部から作ってあるので、公開分と同じ日はこちらを使う
  const merge = j => { const A = j.acts || [];
    for (const [k, days] of Object.entries(j.nights || {})){
      const m = NIGHTS[k] || (NIGHTS[k] = new Map());
      for (const [d, evs] of Object.entries(days)) m.set(d, evs.map(e => { const as = e.slice(1).map(i => A[i]).filter((a, i, l) => a && (!a[0] || l.findIndex(b => b && b[0] === a[0]) === i)); return {title:e[0] || "", names:as.map(a => a[1]), ids:as.map(a => a[0])}; }));
    }
    for (const [id, p] of Object.entries(j.pages || {})) PAGES.set(+id, /^https?:/.test(p) ? p : SITE + p);
    Object.assign(ALIAS, j.alias || {}); };
  if (window.TOWN_NIGHTS) merge(window.TOWN_NIGHTS);
  else try { const r = await fetch(window.TOWN_NIGHTS_URL || "town/nights.json"); if (r.ok) merge(await r.json()); } catch(e){ console.warn("台帳の分を読めませんでした", e); }
  // 組の索引
  for (const [k, m] of Object.entries(NIGHTS)) for (const [d, evs] of m) for (const e of evs) e.names.forEach((n, i) => {
    const id = e.ids ? e.ids[i] : null, key = akey(id, n); if (!key) return;
    let a = ARTISTS.get(key); if (!a){ a = {name:n, key, hits:new Map(), id, seen:new Map()}; ARTISTS.set(key, a); }
    a.seen.set(n, (a.seen.get(n) || 0) + 1);
    if (!a.hits.has(k)) a.hits.set(k, []);
    const l = a.hits.get(k); if (l[l.length-1] !== d) l.push(d);
  });
  for (const a of ARTISTS.values()){ a.n = 0; for (const l of a.hits.values()){ l.sort(); a.n += l.length; }
    const al = (a.id && ALIAS[a.id]) || [];
    a.name = al[0] || [...a.seen].sort((x, y) => y[1] - x[1])[0][0];      // 表示は組の正式な名前（なければいちばん多い書き方）
    a.keys = [...new Set([...a.seen.keys(), ...al].map(nk))].filter(Boolean); }
}
const state = k => PUBLIC.has(k) ? "open" : (NIGHTS[k] && NIGHTS[k].size) ? "staff" : "prep";
const STATE_LABEL = {open:"入れる", staff:"記録あり", prep:"準備中"};
const ymOf = s => s ? String(s).slice(0,7) : null;
const V = k => T.venues.find(v => v.key === k);
function aliveOn(v, d){
  if (v.open && ymOf(d) < (v.open.length === 4 ? v.open + "-01" : v.open)) return false;
  if (v.close && ymOf(d) > v.close) return false;
  return true;
}
const CLOSED = /メンテナンス|大掃除|お休み|休み|休業|定休|レコーディング|機材導入|工事/;
const isClosed = e => !e.names.length && CLOSED.test(e.title || "");
// その夜のそのハコの公演（休みの日は除く）
const nightsAt = (k, d) => { const l = aliveOn(V(k), d) && NIGHTS[k]?.get(d); if (!l) return null; const o = l.filter(e => !isClosed(e)); return o.length ? o : null; };
// 灯りの強さ: 2＝出演者の記録あり、1＝公演名だけ（出演者の記録なし・貸切など）、0＝なし
const levelAt = (k, d) => { const l = nightsAt(k, d); return !l ? 0 : l.some(e => e.names.length) ? 2 : 1; };
const fmtD = d => { const t = new Date(d + "T00:00:00"); return `${d.slice(0,4)}.${+d.slice(5,7)}.${+d.slice(8,10)}（${WD[t.getDay()]}）`; };

/* ---------------------------------------------------------------- 3D */

    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(p,3)); scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({color}))); };

  // 建物（PLATEAU の実際の形。1棟 = 三角形の並び。中心 c からの x, y と地面からの高さ、0.1m 単位）
  const rnd = i => { const x = Math.sin(i*127.1 + 311.7)*43758.5453; return x - Math.floor(x); };

      e1.set(P[1][0]-P[0][0], P[1][1]-P[0][1], P[1][2]-P[0][2]); e2.set(P[2][0]-P[0][0], P[2][1]-P[0][1], P[2][2]-P[0][2]); nn.crossVectors(e1, e2).normalize();

        if (!isTop && wpos){ wpos.push(P[j][0], P[j][1], P[j][2]); wuv.push((P[j][0] + P[j][2])/40 + off, P[j][1]/102 + off); }

  }
  const mesh = (pos, cols) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3)); g.setAttribute("color", new THREE.Float32BufferAttribute(cols,3));
    return new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1})); };
  const wmesh = (wpos, wuv, map, color, opacity) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(wpos,3)); g.setAttribute("uv", new THREE.Float32BufferAttribute(wuv,2));

    for (let r = 0; r < 32; r++) for (let c = 0; c < 16; c++){ const v = rnd(r*16 + c + 7); if (v > 0.26) continue;
      x.fillStyle = v < 0.04 ? "#bcd6ff" : v < 0.16 ? "#ffd58a" : "#8f7440"; x.fillRect(c*16+4, r*16+4, 8, 9); } }, 256, 512);
  { const pos = [], cols = [], wpos = [], wuv = [];

        while (d < Ln){ const t = d/Ln, sd = (lamps.length/3 % 2 ? 1 : -1)*r.w*0.6; lamps.push(ax+(bx-ax)*t - (by-ay)/Ln*sd, 5, -(ay+(by-ay)*t + (bx-ax)/Ln*sd)); d += 35; } acc = (acc + Ln) % 35; } }

    const b = T.buildings[bi], h = b.h, pos = [], cols = [], wpos = [], wuv = [];

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.left = -w/2; camera.right = w/2; camera.top = h/2; camera.bottom = -h/2; camera.updateProjectionMatrix(); }
function place(){ const t = new THREE.Vector3(view.cx, 0, view.cz); camera.position.copy(t).addScaledVector(DIR, 2000); camera.lookAt(t); camera.zoom = view.zoom; camera.updateProjectionMatrix(); camera.updateMatrixWorld(); }
const TOP_PX = 110, BOTTOM_PX = () => ($("#dock").offsetHeight || 260);
function fit(){
  const pts = T.venues.map(v => [v.x, v.y]).concat(T.landmarks.filter(l => l.island === "shinsakae").map(l => [l.x, l.y]));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  view.cx = (Math.min(...xs) + Math.max(...xs))/2; view.cz = -(Math.min(...ys) + Math.max(...ys))/2; view.zoom = 1; place();
  const p = new THREE.Vector3(); let mx = 0, my = 0;
  for (const [x,y] of pts){ p.set(x, 10, -y).project(camera); mx = Math.max(mx, Math.abs(p.x)); my = Math.max(my, Math.abs(p.y)); }
  const usable = (innerHeight - TOP_PX - BOTTOM_PX()) / innerHeight;
  view.baseZoom = Math.min(0.84/mx, usable/my); view.zoom = view.baseZoom; place();
  shiftCenter(view, (TOP_PX - BOTTOM_PX())/2, view.baseZoom); place();
  view.home = [view.cx, view.cz];
}
function shiftCenter(o, px, zoom){ const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion); o.cx += up.x * px/zoom; o.cz += up.z * px/zoom; }
let anim = null;
function zoomTo(cx, cz, zoom, ms, done){ anim = {s:{cx:view.cx, cz:view.cz, zoom:view.zoom}, e:{cx, cz, zoom}, t0:performance.now(), ms:Math.max(ms,1), done}; }
function focusVenue(k, ms){
  const o = venueObj[k]; if (!o) return;
  const z = view.baseZoom * 2.4, t = {cx:o.cx, cz:-o.cy};
  // カードと下の段の分だけ上に見せる
  shiftCenter(t, -(innerHeight*0.30) + TOP_PX/2, z);
  zoomTo(t.cx, t.cz, z, ms ?? 650);

function home(ms){ moved = false; $("#homeBtn").hidden = true; zoomTo(view.home[0], view.home[1], view.baseZoom, ms ?? 600); }

/* ---------------------------------------------------------------- 指とマウスで動かす（角度は固定。ずらすのと寄るのだけ） */
let moved = false;
function basis(){   // 画面の右・上に当たる地面の向き（1px あたりの長さは 1/zoom、奥行きは見下ろす角度の分だけ伸びる）
  const r = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion); r.y = 0; r.normalize();
  const u = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion); u.y = 0; u.normalize().multiplyScalar(1/Math.sin(EL));
  return {r, u};
}
function clampView(){
  const xs = T.islands.flatMap(i => [i.box[0], i.box[2]]), ys = T.islands.flatMap(i => [i.box[1], i.box[3]]);
  view.cx = Math.min(Math.max(view.cx, Math.min(...xs)), Math.max(...xs));
  view.cz = Math.min(Math.max(view.cz, -Math.max(...ys) - 200), -Math.min(...ys) + 200);
  view.zoom = Math.min(Math.max(view.zoom, view.baseZoom*0.7), view.baseZoom*8);
}
function userMoved(){ anim = null; if (!moved){ moved = true; $("#homeBtn").hidden = false; } }
function panPx(dx, dy){   // 指で動かした分だけ街を動かす
  const {r, u} = basis();
  view.cx -= (r.x*dx - u.x*dy)/view.zoom; view.cz -= (r.z*dx - u.z*dy)/view.zoom;
  clampView(); place();
}
function zoomAt(f, sx, sy){   // 画面の点 (sx, sy)（中心からの px）を動かさずに寄る・引く
  const z0 = view.zoom, z1 = Math.min(Math.max(z0*f, view.baseZoom*0.7), view.baseZoom*8);
  const {r, u} = basis(), k = 1/z0 - 1/z1;
  view.cx += (r.x*sx - u.x*sy)*k; view.cz += (r.z*sx - u.z*sy)*k; view.zoom = z1;
  clampView(); place();
}
function bindGestures(){
  const el = renderer.domElement, pts = new Map();
  let last = null;   // {x, y, d}（2本指のときは中点と指のあいだ）
  const center = () => { const p = [...pts.values()]; const x = p.reduce((s,q) => s+q.x, 0)/p.length, y = p.reduce((s,q) => s+q.y, 0)/p.length;
    return {x, y, d: p.length > 1 ? Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) : 0}; };
  el.addEventListener("pointerdown", e => { try { el.setPointerCapture(e.pointerId); } catch(_){} pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); last = center(); });
  el.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const c = center();
    if (last){
      const dx = c.x - last.x, dy = c.y - last.y;
      if (Math.abs(dx) + Math.abs(dy) > 0.5 || (c.d && last.d && c.d !== last.d)) userMoved();
      panPx(dx, dy);
      if (c.d && last.d) zoomAt(c.d/last.d, c.x - innerWidth/2, c.y - innerHeight/2);
    }
    last = c;
  });
  const up = e => { pts.delete(e.pointerId); last = pts.size ? center() : null; };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  el.addEventListener("wheel", e => { e.preventDefault(); userMoved(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX - innerWidth/2, e.clientY - innerHeight/2); }, {passive:false});
  el.addEventListener("dblclick", e => { userMoved(); zoomAt(1.8, e.clientX - innerWidth/2, e.clientY - innerHeight/2); });
}
let lastT = 0;
function tick(){
  const t = clock.getElapsedTime(); moveCars(Math.min(t - lastT, .05)); lastT = t;
  { const k = view.zoom/view.baseZoom; if (lampMat) lampMat.size = Math.min(5*k, 26); if (carMat) carMat.size = Math.min(4.5*k, 22); }
  if (anim){
    const k = Math.min(1, (performance.now() - anim.t0)/anim.ms), e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
    for (const f of ["cx","cz","zoom"]) view[f] = anim.s[f] + (anim.e[f] - anim.s[f])*e; place();
    if (k >= 1){ const d = anim.done; anim = null; d && d(); }
  }
  for (const o of Object.values(venueObj)){
    const f = 0.85 + 0.15*Math.sin(t*1.7 + o.bi), on = o.on === true ? 1 : (o.on || 0);
    o.win.material.opacity = on*f; o.sp.material.opacity = on*0.75*f; o.pool.material.opacity = on*0.5*f;
    o.ring.material.opacity += ((o.sel ? 0.9 : 0) - o.ring.material.opacity)*0.2;
    o.grp.scale.y += ((o.alive ? 1 : 0.06) - o.grp.scale.y)*0.12;
  }
  renderer.render(scene, camera);
  movePins();
}

/* ---------------------------------------------------------------- 地図の印 */
const PINS = [], MARKS = [];
function buildPins(){
  const box = $("#pins");
  for (const isl of T.islands){ const [x1,y1,x2,y2] = isl.box; const el = document.createElement("div"); el.className = "mark island"; el.textContent = isl.name; box.appendChild(el); MARKS.push({el, x:(x1+x2)/2, y:y2+6, h:0}); }
  for (const l of T.landmarks){ const el = document.createElement("div"); el.className = "mark station"; el.textContent = "● " + l.name; box.appendChild(el); MARKS.push({el, x:l.x, y:l.y, h:2}); }
  // 同じ建物のハコは印を横にずらす
  const seen = {};
  for (const v of T.venues){
    const el = document.createElement("button"); el.type = "button"; el.className = "pin"; el.setAttribute("aria-label", v.name);
    el.innerHTML = `<i></i><span></span>`; el.onclick = () => select(v.key);
    box.appendChild(el);
    const o = venueObj[v.key]; const n = o ? (seen[o.bi] = (seen[o.bi] || 0) + 1) - 1 : 0;
    PINS.push({el, v, dx:n*16});
  }
}
const pv = new THREE.Vector3();
function movePins(){
  const W = innerWidth, H = innerHeight;
  for (const P of PINS){ const o = venueObj[P.v.key]; const h = o ? o.h*o.grp.scale.y + 4 : 6;
    pv.set(o ? o.cx : P.v.x, h, -(o ? o.cy : P.v.y)).project(camera);
    P.el.style.left = ((pv.x+1)/2*W + P.dx).toFixed(1) + "px"; P.el.style.top = ((1-pv.y)/2*H).toFixed(1) + "px"; }
  for (const M of MARKS){ pv.set(M.x, M.h, -M.y).project(camera); M.el.style.left = ((pv.x+1)/2*W).toFixed(1) + "px"; M.el.style.top = ((1-pv.y)/2*H).toFixed(1) + "px"; }
}
function refreshPins(){
  for (const P of PINS){
    const v = P.v, k = v.key, alive = aliveOn(v, date), lv = levelAt(k, date), lit = lv === 2;
    const hit = artist && artist.hits.has(k);
    P.el.className = "pin" + (lit ? " lit" : lv === 1 ? " faint" : "") + (state(k) === "open" ? " open" : "") + (alive ? "" : " gone") + (selected === k ? " sel" : "") + (hit ? " hit" : "");
    const label = v.key === "apollo" && date >= "2022-09" ? v.name : v.name;
    P.el.querySelector("span").innerHTML = esc(shortName(v)) + (hit ? `<b>${artist.hits.get(k).length}</b>` : "");
    P.el.hidden = !!artist && !hit && !lit && selected !== k && !alive;
  }
}
const shortName = v => ({crr:"ROCK'N'ROLL", apollo:"APOLLO", diamond:"DIAMOND HALL", shangrila:"シャングリラ", daytrive:"DAYTRIVE", radseven:"RAD SEVEN", sunsetblue:"sunset BLUE", spadebox:"SPADE BOX", sixdog:"SiX-DOG", daytrip:"DAYTRIP"})[v.key] || v.name;

/* ---------------------------------------------------------------- 夜を決める */
function setDate(d, keepYearSlider){
  date = d;
  const y = +d.slice(0,4);
  $("#year").value = y; $("#yearOut").textContent = y;
  const ago = THIS_YEAR - y;
  const sameMD = d.slice(5) === TODAY.slice(5);
  $("#when").innerHTML = `${fmtD(d)}<span>${sameMD ? (ago ? ago + "年前の今夜" : "今夜") : ""}</span>`;
  for (const v of T.venues){ const o = venueObj[v.key]; if (!o) continue;
    const same = T.venues.filter(w => venueObj[w.key] === o);
    o.alive = same.some(w => aliveOn(w, d)); const lv = Math.max(...same.map(w => levelAt(w.key, d))); o.on = lv === 2 ? 1 : lv === 1 ? 0.3 : 0; o.sel = same.some(w => w.key === selected); }
  const lit = T.venues.flatMap(v => (nightsAt(v.key, d) || []).map(e => ({v, e})));
  $("#pane-tonight").innerHTML = lit.length
    ? lit.sort((a, b) => b.e.names.length - a.e.names.length).map(({v, e}) => `<button type="button" class="row${e.names.length ? "" : " faint"}" data-k="${v.key}"><b>${esc(shortName(v))}</b><span>${esc(e.title || "")}${e.names.length ? (e.title ? "｜" : "") + esc(e.names.slice(0,6).join(" / ")) + (e.names.length > 6 ? " ほか" : "") : "（出演者の記録なし）"}</span></button>`).join("")
    : `<div class="none">この夜の公演の記録はありません。年のつまみを動かすか、「組・さがす」で組や日付から探してください。</div>`;
  $("#pane-tonight").querySelectorAll(".row").forEach(b => b.onclick = () => select(b.dataset.k));
  $("#sub").textContent = artist ? `「${artist.name}」の出たハコを光らせています` : `${lit.length ? lit.length + " 公演" + (lit.some(x => !x.e.names.length) ? `（うち出演者の記録なし ${lit.filter(x => !x.e.names.length).length}）` : "") : "公演の記録なし"} ・ 入れるハコ ${T.venues.filter(v => state(v.key) === "open").length} 軒`;
  if (artist) for (const v of T.venues){ const o = venueObj[v.key]; if (o && artist.hits.has(v.key)) o.on = true; }
  refreshPins(); renderShelf(); if (selected) renderCard();
}
const setYear = y => setDate(`${y}-${TODAY.slice(5)}`);
function firstYear(){
  for (let y = THIS_YEAR; y >= 2000; y--){ const d = `${y}-${TODAY.slice(5)}`; if (d <= TODAY && T.venues.some(v => levelAt(v.key, d) === 2)) return y; }
  return THIS_YEAR - 1;
}

/* ---------------------------------------------------------------- 下の段 */
function showPane(p){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.pane === p));
  for (const n of ["tonight", "venues", "artist"]) $("#pane-" + n).hidden = n !== p;
  if (p === "artist") setTimeout(() => $("#q").focus(), 50);
}
function renderShelf(){
  const vs = [...T.venues].sort((a,b) => (a.island === b.island ? a.x - b.x : a.island === "shinsakae" ? -1 : 1));
  $("#shelf").innerHTML = vs.map(v => { const k = v.key, st = state(k), alive = aliveOn(v, date), lv = levelAt(k, date), lit = lv === 2;
    const town = v.island === "tsurumai" ? "鶴舞" : v.cluster || (v.building === "unryu" ? "雲竜フレックスビル" : "新栄");
    return `<button type="button" data-k="${k}" class="${lit ? "lit" : lv === 1 ? "faint" : ""}${alive ? "" : " gone"}"><span class="town">${esc(town)}</span><b>${esc(v.name)}</b>
      <small class="st-${st}">${v.landmark && !v.arc ? "目印" : alive ? STATE_LABEL[st] : (v.close && ymOf(date) > v.close ? "閉店" : "まだない")}${artist && artist.hits.has(k) ? ` ・ ${artist.hits.get(k).length}回` : ""}</small></button>`; }).join("");
  $("#shelf").querySelectorAll("button").forEach(b => b.onclick = () => select(b.dataset.k));
}
function search(q){
  const s = q.trim(), out = [];
  if (!s){ $("#hits").innerHTML = artist ? "" : `<div class="none">組の名前を打つと、その組が出たハコが光ります。ハコの名前や日付（2015/8/1）でも探せます。</div>`; return; }
  const m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if (m) out.push({kind:"日付", label:`${m[1]}.${+m[2]}.${+m[3]} の夜`, go:() => { setDate(`${m[1]}-${pad(m[2])}-${pad(m[3])}`); showPane("tonight"); }});
  const key = nk(s);
  for (const v of T.venues) if (nk(v.name).includes(key) || nk(shortName(v)).includes(key)) out.push({kind:"ハコ", label:v.name, go:() => select(v.key)});
  const as = [...ARTISTS.values()].filter(a => a.keys.some(x => x.includes(key))).sort((a,b) => (a.keys.some(x => x.startsWith(key)) ? 0 : 1) - (b.keys.some(x => x.startsWith(key)) ? 0 : 1) || b.n - a.n).slice(0, 30);
  for (const a of as) out.push({kind:`組・${a.n}回${pageOf(a) ? "・ページあり" : ""}`, label:a.name, go:() => pickArtist(a)});
  $("#hits").innerHTML = out.length ? out.map((h, i) => `<button type="button" data-i="${i}"><small>${esc(h.kind)}</small><span>${esc(h.label)}</span></button>`).join("") : `<div class="none">見つかりませんでした。</div>`;
  $("#hits").querySelectorAll("button").forEach(b => b.onclick = () => out[+b.dataset.i].go());
}
function pickArtist(a, keep){   // keep = {date, venue}: その夜・そのハコを開いたまま組だけ選ぶ（カードの出演者やほかのページからのリンク）
  artist = a; if (!keep || !keep.venue) closeCard(true);
  const on = $("#artistOn"); on.hidden = false;
  on.innerHTML = `<b>${esc(a.name)}</b><span style="color:var(--ink-2)">${a.hits.size} 軒・${a.n} 回</span>${pageOf(a) ? `<a class="btn" href="${esc(pageOf(a))}"${NEW_TAB ? ' target="_blank" rel="noopener"' : ""} style="margin-left:auto;padding:5px 10px">この組のページ</a>` : ""}<button type="button" class="btn" id="clearArtist" style="${pageOf(a) ? "" : "margin-left:auto;"}padding:5px 10px">やめる</button>`;
  $("#clearArtist").onclick = clearArtist;
  $("#q").value = ""; $("#hits").innerHTML = "";
  // 年のつまみに出た年の印
  const years = new Set(); for (const l of a.hits.values()) for (const d of l) years.add(+d.slice(0,4));
  const lo = +$("#year").min, hi = +$("#year").max;
  $("#ticks").innerHTML = [...years].map(y => `<i style="left:${((y-lo)/(hi-lo)*100).toFixed(2)}%"></i>`).join("");
  // いちばん最近に出た夜へ
  const last = [...a.hits.values()].flat().sort().pop(); setDate(keep && keep.date || last);
  if (keep && keep.venue && V(keep.venue)) select(keep.venue); else home();
}
function clearArtist(){ artist = null; $("#artistOn").hidden = true; $("#ticks").innerHTML = ""; search(""); setDate(date); }

/* ---------------------------------------------------------------- カード */
function select(k){
  selected = k; const v = V(k);
  // 同じ建物のほかの階も見せる
  setDate(date); renderCard(); $("#card").classList.add("on"); focusVenue(k);
}
function closeCard(keepView){ selected = null; $("#card").classList.remove("on"); setDate(date); if (!keepView) home(); }
let ylistOpen = false;
function yearList(k){   // その年にそのハコであった公演（休みの日は除く）
  const y = date.slice(0, 4), m = NIGHTS[k]; if (!m) return "";
  const ds = [...m.keys()].filter(d => d.startsWith(y) && nightsAt(k, d)).sort(); if (!ds.length) return "";
  return `<details class="ylist"${ylistOpen ? " open" : ""}><summary>${y}年の公演 ${ds.length} 件</summary>${ds.map(d => nightsAt(k, d).map(e =>
    `<button type="button" data-d="${d}" class="${d === date ? "cur" : ""}"><span class="d">${+d.slice(5,7)}/${+d.slice(8,10)}</span><span>${esc(e.title || "")}${e.names.length ? `<small>${esc(e.names.slice(0, 8).join(" / "))}${e.names.length > 8 ? " ほか" : ""}</small>` : ""}</span></button>`).join("")).join("")}</details>`;
}
function renderCard(){
  const v = V(selected), k = v.key, st = state(k), alive = aliveOn(v, date), evs = nightsAt(k, date);
  const floors = v.building ? T.venues.filter(w => w.building === v.building) : [];
  const years = v.open || v.close ? `${v.open ? v.open.replace("-", "年") + "月" : "?"}〜${v.close ? v.close.replace("-", "年") + "月" : ""}`.replace(/年(\d)月/, "年$1月").replace(/^(\d{4})月/, "$1年") : "";
  let body = "";
  if (artist && artist.hits.has(k)){
    const ds = artist.hits.get(k);
    body = `<div class="night"><b style="color:var(--lamp)">${esc(artist.name)}</b> がここに出た夜（${ds.length}回）<div class="dates">${ds.map(d => `<button type="button" data-d="${d}" class="${d === date ? "cur" : ""}">${d.replaceAll("-", ".")}</button>`).join("")}</div></div>`;
  }
  body += evs ? `<div class="night">${evs.map(e => `<div><span class="d">${fmtD(date)}</span>${esc(e.title)}${e.names.length ? `<span class="who">${e.names.map((n, i) => `<button type="button" data-a="${esc(akey(e.ids && e.ids[i], n))}" class="${artist && artist.key === akey(e.ids && e.ids[i], n) ? "cur" : ""}">${esc(n)}</button>`).join("")}</span>` : `<br><span style="color:var(--ink-2)">出演者の記録なし（公演名だけが残っています）</span>`}</div>`).join("")}</div>`
              : `<div class="night none">${alive ? ((NIGHTS[k]?.get(date) || []).some(isClosed) ? `この夜はお店の記録では「${esc(NIGHTS[k].get(date).find(isClosed).title)}」です。` : "この夜の公演の記録はありません。") : v.close && ymOf(date) > v.close ? "この年にはもう閉店しています。" : "この年にはまだありません。"}</div>`;
  const total = NIGHTS[k]?.size || 0;
  const canEnter = st === "open" || v.page;
  $("#card").innerHTML = `<div class="head"><div style="flex:1;min-width:0"><h2>${esc(v.name)}</h2>
      <div class="meta">${esc(v.addr || "")}${years ? "・" + esc(years) : ""}</div>
      <div class="meta"><span class="st st-${st}">${v.landmark && !v.arc ? "目印（公演の記録はまだありません）" : STATE_LABEL[st]}</span>${total ? `・記録 ${total} 夜` : ""}</div></div>
      <button type="button" class="btn" id="cardClose" aria-label="閉じる">✕</button></div>
    ${floors.length > 1 ? `<div class="floors">${floors.map(w => `<button type="button" data-k="${w.key}" class="${w.key === k ? "cur" : ""}">${esc(w.floor || "")} ${esc(shortName(w))}</button>`).join("")}</div>` : ""}
    ${body}
    ${yearList(k)}
    <div class="acts">${canEnter ? (NEW_TAB ? `<a class="btn primary" href="${esc(enterUrl(v))}" target="_blank" rel="noopener">入る（別のタブで開きます）</a>` : `<button type="button" class="btn primary" id="enter">入る</button>`) : `<span class="meta">${st === "staff" ? "" : "準備中です"}</span>`}
      ${pageOf(artist) ? `<a class="btn" href="${esc(pageOf(artist))}"${NEW_TAB ? ' target="_blank" rel="noopener"' : ""}>${esc(artist.name)} のページ</a>` : ""}</div>`;
  $("#cardClose").onclick = () => closeCard();
  $("#card").querySelectorAll(".floors button").forEach(b => b.onclick = () => select(b.dataset.k));
  $("#card").querySelectorAll(".dates button").forEach(b => b.onclick = () => setDate(b.dataset.d));
  $("#card").querySelectorAll(".ylist button").forEach(b => b.onclick = () => setDate(b.dataset.d));
  $("#card").querySelectorAll(".who button").forEach(b => b.onclick = () => { const a = ARTISTS.get(b.dataset.a); if (a) pickArtist(a, {date, venue:k}); });
  const yl = $("#card .ylist"); if (yl) yl.addEventListener("toggle", () => { ylistOpen = yl.open; });
  const en = $("#enter"); if (en) en.onclick = () => enter(v);
}
// 自前のアーカイブがあるハコ（SiX-DOG）はそちらへ。その夜に公演があればその日のページ、なければ会場（3D）
const enterUrl = v => v.night_page && NIGHTS[v.key]?.has(date) ? v.night_page.replace("{date}", date) : (v.page || VENUE_PAGE(v.arc, v));
// Claude の中のページ（関係者用）は自分でほかのサイトへ切り替われないので、別のタブで開くリンクにする
const NEW_TAB = !!window.TOWN_NEW_TAB;
function enter(v){
  const o = venueObj[v.key] || {cx:v.x, cy:v.y};
  $("#card").classList.remove("on");
  zoomTo(o.cx, -o.cy, view.baseZoom*7, 1400);
  setTimeout(() => $("#fade").style.opacity = 1, 900);
  // 自前のアーカイブがあるハコ（SiX-DOG）はそちらへ。その夜に公演があればその日のページ、なければ会場（3D）
  const url = enterUrl(v);
  setTimeout(() => { location.href = url; }, 1450);
}

/* ---------------------------------------------------------------- オープニング
   遠くから街へ寄りながら、年が 2000 年から走る。ハコが建ち、灯りが点いたり消えたりして「○年前の今夜」で止まる。
   画面を押すと飛ばせる。同じ端末で2回目からは短くする */
function intro(target){
  let seen = false; try { seen = !!sessionStorage.getItem("nla_seen"); sessionStorage.setItem("nla_seen", "1"); } catch(e){}
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || target <= 2001){ setYear(target); return; }
  const y0 = 2000, ms = seen ? 2200 : 6500, z1 = view.baseZoom, z0 = z1*0.42, t0 = performance.now();
  let cur = -1, done = false;
  document.body.classList.add("intro");
  const finish = () => { if (done) return; done = true; document.body.classList.remove("intro"); view.zoom = z1; place(); setYear(target); removeEventListener("pointerdown", finish, true); };
  addEventListener("pointerdown", finish, true);
  (function step(){
    if (done) return;
    const k = Math.min(1, (performance.now() - t0)/ms), e = 1 - Math.pow(1 - k, 3);
    view.zoom = z0 + (z1 - z0)*e; place();
    const y = Math.round(y0 + (target - y0)*Math.min(1, k*1.08));
    if (y !== cur){ cur = y; setYear(y); }
    if (k >= 1) finish(); else requestAnimationFrame(step);
  })();
}

/* ---------------------------------------------------------------- はじめ */
(async () => {
  try { await loadData(); } catch(e){ $("#loading").textContent = "街のデータを読めませんでした"; console.error(e); return; }
  $("#year").max = THIS_YEAR;
  build();
  search("");
  // ほかのページからのリンク: map.html?d=2016-05-22&v=crr&a=1263（日付・ハコ・組の番号。どれも省ける）
  const q = new URLSearchParams(location.search), qd = /^\d{4}-\d\d-\d\d$/.test(q.get("d") || "") ? q.get("d") : null,
        qv = T.venues.some(v => v.key === q.get("v")) ? q.get("v") : null, qa = ARTISTS.get("#" + q.get("a")) || (q.get("n") ? ARTISTS.get(nk(q.get("n"))) || [...ARTISTS.values()].find(x => x.keys.includes(nk(q.get("n")))) : null);
  if (qd || qv || qa){   // 行き先が決まっているときはオープニングを飛ばす
    setYear(+(qd || TODAY).slice(0, 4)); if (qd) setDate(qd);
    if (qa){ showPane("artist"); pickArtist(qa, {date:qd, venue:qv}); } else if (qv) select(qv);
  } else intro(firstYear());
  $("#loading").remove();
  $("#year").addEventListener("input", e => setYear(+e.target.value));
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => showPane(t.dataset.pane));
  $("#searchBtn").onclick = () => showPane("artist");
  $("#homeBtn").onclick = () => home();
  $("#q").addEventListener("input", e => search(e.target.value));
  addEventListener("keydown", e => { if (e.key === "Escape" && selected) closeCard(); });
  addEventListener("pageshow", e => { if (e.persisted){ $("#fade").style.opacity = 0; home(0); } });
})();
</script>
